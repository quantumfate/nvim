---
# System toolchain provisioning. Run: just provision
# ansible.builtin.package auto-selects the host package manager; names are
# chosen per OS family below. Add a family key to extend to other distros.
- name: Provision development toolchain
  hosts: localhost
  connection: local
  become: true
  vars:
    toolchain_packages:
      Archlinux:
        - git
        - just
        - pre-commit
        - stylua
        - lua-language-server
        - luarocks
        - yamllint
        - prettier
      Debian:
        - git
        - just
        - pre-commit
        - stylua
        - lua-language-server
        - luarocks
        - yamllint
        - prettier
      RedHat:
        - git
        - just
        - pre-commit
        - stylua
        - lua-language-server
        - luarocks
        - yamllint
        - prettier
  tasks:
    - name: Install toolchain packages
      ansible.builtin.package:
        name: "{{ toolchain_packages[ansible_facts['os_family']]
          | default(toolchain_packages['Archlinux']) }}"
        state: present
    - name: Bootstrap lua toolchain
      become: false
      ansible.builtin.shell: |
        command -v luarocks >/dev/null && luarocks install --local luacheck >/dev/null 2>&1 || true
      changed_when: false
    - name: Wire tool paths into ~/.profile
      become: false
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.profile"
        create: true
        line: "{{ item }}"
      loop:
        - 'export PATH="$HOME/.luarocks/bin:$PATH"'
