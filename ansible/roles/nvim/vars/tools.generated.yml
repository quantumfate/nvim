  lua:
    packages:
      - "lua51"
      - "luarocks"
      - "lua-language-server"
      - "stylua"
    bin_paths:
      - "$HOME/.luarocks/bin"
    bootstrap:
      - name: "luarocks-nlua"
        cmd: "luarocks install --local --lua-version 5.1 nlua"
        creates: "$HOME/.luarocks/bin/nlua"
      - name: "local-lua-debugger"
        cmd: >-
          dst="$XDG_DATA_HOME/nvim/dap/local-lua-debugger-vscode" &&
          git clone --depth 1 https://github.com/tomblind/local-lua-debugger-vscode "$dst" &&
          npm --prefix "$dst" install &&
          npm --prefix "$dst" run build
        creates: "$XDG_DATA_HOME/nvim/dap/local-lua-debugger-vscode/extension/debugAdapter.js"
      - name: "luarocks-luacheck"
        cmd: "luarocks install --local --lua-version 5.1 luacheck"
        creates: "$HOME/.luarocks/bin/luacheck"
    tools:
      - name: "lua_ls"
        kind: "lsp"
        bin: "lua-language-server"
        package: "lua-language-server"
        optional: false
      - name: "stylua"
        kind: "fmt"
        bin: "stylua"
        package: "stylua"
        optional: false
      - name: "luacheck"
        kind: "lint"
        bin: "luacheck"
        package: null
        optional: true
      - name: "nlua"
        kind: "dap"
        bin: "nlua"
        package: null
        optional: false
      - name: "local-lua"
        kind: "dap"
        bin: "node"
        path: "$XDG_DATA_HOME/nvim/dap/local-lua-debugger-vscode/extension/debugAdapter.js"
        package: null
