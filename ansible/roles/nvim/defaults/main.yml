---
# The tool list lives in vars/tools.generated.yml, generated from
# lua/toolchain/registry.lua. Regenerate with `just toolchain-export`.

nvim_app_name: nvim
nvim_repo_path: "{{ playbook_dir }}/.."
nvim_config_dir: "{{ ansible_facts.user_dir }}/.config/nvim"
nvim_data_dir: "{{ ansible_facts.user_dir }}/.local/share/nvim"
nvim_state_dir: "{{ ansible_facts.user_dir }}/.local/state/nvim"

# Ecosystems to install. Empty means every ecosystem in the generated vars.
nvim_ecosystem_filter: []
# Extra packages that belong to no ecosystem.
nvim_extra_packages: []

nvim_install_packages: true
# Repo packages a wanted package replaces. The repo `zls` lags the compiler and
# conflicts with the AUR `zls-bin` that matches it.
nvim_conflicting_packages:
  - zls
  # Owns /usr/bin/vscode-json-language-server, which vscode-langservers-extracted
  # also ships; the extracted package covers json, html, css and eslint.
  - vscode-json-languageserver
nvim_run_bootstrap: true

# Mason is gone: remove its package tree and the PATH entry shadowing /usr/bin.
nvim_purge_mason: true
nvim_mason_dir: "{{ nvim_data_dir }}/mason"
# Searched for a stale mason PATH entry; chezmoi-managed ones are edited at source.
nvim_shell_env_files:
  - "{{ ansible_facts.user_dir }}/.zshenv"
  - "{{ ansible_facts.user_dir }}/.profile"
# File that receives the per-user tool bin dirs (~/.cargo/bin, ~/.luarocks/bin, ...).
nvim_profile_file: "{{ ansible_facts.user_dir }}/.profile"

# Run neovim once, headless, to install plugins and rewrite the tool store.
nvim_sync_plugins: true
# Compile the treesitter parsers in the same headless run; without it the first
# interactive session spends minutes building grammars.
nvim_install_parsers: true
nvim_refresh_store: true
nvim_store_path: "{{ nvim_state_dir }}/tools.json"

# Fail the play when a required tool did not end up on PATH.
nvim_verify_tools: true

# Every failing step notifies and appends to the event log, so a status bar never
# has to parse ansible output.
nvim_notify_failures: true
nvim_notify_script: "{{ ansible_facts.user_dir }}/.local/bin/nvim-tool-notify"
# Shared with the editor: :ToolchainUpdate appends to the same file, tagged by source.
nvim_event_log: "{{ nvim_state_dir }}/toolchain-events.jsonl"
nvim_notify_urgency: critical
