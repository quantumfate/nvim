---
nvim_app_name: nvim
nvim_repo_path: "{{ playbook_dir }}/.."

nvim_config_dir: "{{ ansible_facts.user_dir }}/.config/nvim"

# Package names verified against the Arch repos and the AUR; see
# AUR-dependencies.txt for the tool -> package mapping and notes.

nvim_install_packages: true
nvim_packages:
  - neovim
  - git
  - base-devel # gcc + make, for treesitter parsers and LuaSnip jsregexp
  - tree-sitter-cli
  - ripgrep
  - fd
  - fzf
  - curl
  - wget

nvim_install_language_runtimes: true
nvim_language_runtimes:
  - nodejs
  - npm
  - pnpm
  - go
  - rustup
  - python
  - uv
  - lua51
  - luarocks
  - zig

nvim_install_lsp_servers: true
nvim_lsp_servers:
  - lua-language-server
  - basedpyright # AUR
  - typescript-language-server
  - rust-analyzer
  - gopls
  - clang # provides clangd + clang-format
  - vscode-json-languageserver
  - yaml-language-server
  - ansible-language-server # AUR
  - tailwindcss-language-server
  - bash-language-server
  - qt6-tools # provides qmlls6
  - svelte-language-server
  - taplo-cli
  - marksman
  - zls
  - vue-language-server
  - bacon # bacon_ls backend; bacon-ls itself via Mason/cargo

nvim_install_formatters: true
nvim_formatters:
  - stylua
  - prettierd # AUR
  - prettier
  - python-black
  - ruff
  - shfmt
  - go-tools # provides goimports
  - deno
  - fish # provides fish_indent
  - just
  - codespell
  # gofmt ships with go, zigfmt with zig, clang-format with clang,
  # rustfmt is a rustup component — all already installed above.

nvim_install_linters: true
nvim_linters:
  - eslint_d
  - eslint
  - shellcheck
  - markdownlint-cli
  - yamllint
  - hadolint-bin # AUR
  - ansible-lint
  - ansible
  - nodejs-jsonlint # AUR, provides jsonlint
  - python-cpplint # AUR

nvim_install_dap: true
nvim_dap:
  - python-debugpy
  - codelldb-bin # AUR
  - vscode-js-debug-bin # AUR
  - delve
  # nlua (Lua debugging) comes from lua51 + `luarocks install nlua`

nvim_install_editor_integration_tools: true
nvim_editor_integration_tools:
  - lazygit
  - devpod-bin # AUR
  - chezmoi
  - tmux
  - wl-clipboard
  - pre-commit
  # ollama omitted — only needed by avante.nvim, currently disabled
