---
# Tool list comes from vars/tools.generated.yml, generated out of
# lua/toolchain/registry.lua — never edit it here.

- name: Load the generated tool registry
  ansible.builtin.include_vars:
    file: tools.generated.yml

- name: Select the ecosystems to install
  ansible.builtin.set_fact:
    nvim_selected: >-
      {{ nvim_ecosystems if not nvim_ecosystem_filter
         else nvim_ecosystems | dict2items
              | selectattr('key', 'in', nvim_ecosystem_filter)
              | items2dict }}

- name: Collect every package the selected ecosystems want
  ansible.builtin.set_fact:
    nvim_wanted_packages: >-
      {{ (nvim_selected.values() | map(attribute='packages') | flatten | list
          + nvim_extra_packages) | unique }}

- name: Install the failure notifier
  ansible.builtin.template:
    src: nvim-tool-notify.sh.j2
    dest: "{{ nvim_notify_script }}"
    mode: "0755"
  become: false

- name: Work out which packages are missing
  # A run that installs nothing skips the transaction below.
  ansible.builtin.command:
    argv: "{{ ['pacman', '-T'] + nvim_wanted_packages }}"
  register: nvim_missing_packages
  changed_when: false
  # -T exits 127 when something is missing, the normal case here.
  failed_when: nvim_missing_packages.rc not in [0, 127]
  check_mode: false

- name: Drop packages the toolchain replaces
  # pacman refuses a transaction whose members conflict, and nothing else removes
  # these. A name the registry itself wants is never a conflict.
  when:
    - nvim_install_packages
    - nvim_conflicting_packages | difference(nvim_wanted_packages) | length > 0
  community.general.pacman:
    name: "{{ nvim_conflicting_packages | difference(nvim_wanted_packages) }}"
    state: absent
  become: true

- name: Install the toolchain packages
  when: nvim_install_packages and nvim_missing_packages.stdout_lines | length > 0
  block:
    - name: Install packages
      kewlfft.aur.aur:
        name: "{{ nvim_wanted_packages }}"
        use: yay
        state: present
      become: false
  rescue:
    - name: Report the package failure
      ansible.builtin.command:
        argv:
          - "{{ nvim_notify_script }}"
          - --phase
          - packages
          - --exit
          - "1"
          - --detail
          - "{{ ansible_failed_result.msg | default('package installation failed') | truncate(300) }}"
      changed_when: false
      when: nvim_notify_failures
      become: false

    - name: Re-raise the package failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('package installation failed') }}"

- name: Run the per-ecosystem bootstrap steps
  when: nvim_run_bootstrap
  ansible.builtin.include_tasks: bootstrap.yml
  loop: "{{ nvim_selected.values() | map(attribute='bootstrap') | select('defined') | flatten }}"
  loop_control:
    label: "{{ item.name }}"

# Editing a chezmoi-managed file directly is undone by the next `chezmoi apply`.
- name: Resolve the shell files through chezmoi
  ansible.builtin.include_tasks: chezmoi_target.yml
  loop: "{{ nvim_shell_env_files + [nvim_profile_file] }}"
  loop_control:
    loop_var: nvim_target_file

- name: Remove the leftover mason tree
  when: nvim_purge_mason
  become: false
  block:
    - name: Delete the mason package directory
      ansible.builtin.file:
        path: "{{ nvim_mason_dir }}"
        state: absent

    - name: Drop mason from the shell PATH
      ansible.builtin.lineinfile:
        path: "{{ nvim_edit_paths[item] }}"
        regexp: mason/bin
        state: absent
      loop: "{{ nvim_shell_env_files }}"
      when: nvim_edit_paths[item] is defined
      register: nvim_mason_path_edit

- name: Put the per-user tool bin dirs on PATH
  ansible.builtin.lineinfile:
    path: "{{ nvim_edit_paths[nvim_profile_file] }}"
    create: true
    mode: "0644"
    line: 'export PATH="{{ item }}:$PATH"'
  become: false
  loop: "{{ nvim_selected.values() | map(attribute='bin_paths') | select('defined') | flatten | unique }}"
  register: nvim_profile_edit

- name: Apply the chezmoi source changes
  ansible.builtin.command: chezmoi apply
  become: false
  changed_when: true
  when:
    - nvim_chezmoi_managed | default(false)
    - (nvim_mason_path_edit is changed) or (nvim_profile_edit is changed)

- name: Manage the config directory
  when: (nvim_repo_path | realpath) != (nvim_config_dir | realpath)
  become: false
  block:
    - name: Check whether the config target exists
      ansible.builtin.stat:
        path: "{{ nvim_config_dir }}"
      register: nvim_config_dir_stat

    - name: Probe the config target for uncommitted changes # noqa: command-instead-of-module
      ansible.builtin.command: git -C {{ nvim_config_dir }} status --porcelain
      register: nvim_config_dir_dirty
      changed_when: false
      failed_when: false
      check_mode: false
      when: nvim_config_dir_stat.stat.exists and not nvim_config_dir_stat.stat.islnk

    - name: Abort — config target is a git checkout with uncommitted changes
      ansible.builtin.fail:
        msg: >-
          {{ nvim_config_dir }} has uncommitted changes; commit or move them
          before re-linking the config.
      when: nvim_config_dir_dirty is defined and nvim_config_dir_dirty.stdout | length > 0

    - name: Remove the old config target
      ansible.builtin.file:
        path: "{{ nvim_config_dir }}"
        state: absent
      when: nvim_config_dir_stat.stat.exists and not nvim_config_dir_stat.stat.islnk

    - name: Symlink the config into place
      ansible.builtin.file:
        src: "{{ nvim_repo_path | realpath }}"
        dest: "{{ nvim_config_dir }}"
        state: link
        force: true

- name: Install the neovim plugins headlessly
  when: nvim_sync_plugins
  become: false
  block:
    - name: Sync lazy.nvim
      ansible.builtin.command: nvim --headless "+Lazy! sync" +qa
      register: nvim_lazy_sync
      changed_when: "'Installed' in nvim_lazy_sync.stderr or 'Updated' in nvim_lazy_sync.stderr"
      # blink.cmp builds with cargo, LuaSnip with make.
      timeout: 1800
  rescue:
    - name: Report the plugin sync failure
      ansible.builtin.command:
        argv:
          - "{{ nvim_notify_script }}"
          - --phase
          - plugins
          - --exit
          - "1"
          - --detail
          - "{{ ansible_failed_result.msg | default('lazy.nvim sync failed') | truncate(300) }}"
      changed_when: false
      when: nvim_notify_failures

    - name: Re-raise the plugin sync failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('lazy.nvim sync failed') }}"

- name: Build the treesitter parsers headlessly
  # The editor installs missing parsers asynchronously on startup, which loses its
  # race with `+qa`; TSSyncInstall is the blocking form.
  when: nvim_install_parsers
  become: false
  block:
    - name: Install every missing parser
      ansible.builtin.command: nvim --headless "+TSSyncInstall" +qa
      register: nvim_ts_install
      changed_when: "'Installed' in (nvim_ts_install.stderr | default(''))"
      timeout: 1800
  rescue:
    - name: Report the parser build failure
      ansible.builtin.command:
        argv:
          - "{{ nvim_notify_script }}"
          - --phase
          - parsers
          - --exit
          - "1"
          - --detail
          - "{{ ansible_failed_result.msg | default('treesitter parser install failed') | truncate(300) }}"
      changed_when: false
      when: nvim_notify_failures

    # Parsers rebuild on demand in the editor; a failure here is not fatal.
    - name: Continue past the parser build failure
      ansible.builtin.debug:
        msg: "treesitter parser install failed; the editor will retry on first use"

- name: Refresh the tool store
  # Neovim owns the store; the role only asks for a re-probe, then reads it.
  when: nvim_refresh_store
  become: false
  ansible.builtin.command: >-
    nvim --headless -c "lua require('toolchain.store').refresh({}, function() vim.cmd('qa!') end)"
  # Regenerating a derived file is not a change to the machine.
  changed_when: false
  timeout: 300

- name: Verify the toolchain
  when: nvim_verify_tools and nvim_refresh_store
  become: false
  block:
    - name: Read the tool store
      ansible.builtin.slurp:
        src: "{{ nvim_store_path }}"
      register: nvim_store_raw

    - name: Collect the tools that did not resolve
      ansible.builtin.set_fact:
        nvim_missing_tools: "{{ (nvim_store_raw.content | b64decode | from_json).summary.missing_tools }}"

    - name: Report the missing tools
      ansible.builtin.command:
        argv:
          - "{{ nvim_notify_script }}"
          - --phase
          - verify
          - --exit
          - "1"
          - --detail
          - "not on PATH after install: {{ nvim_missing_tools | join(', ') }}"
      changed_when: false
      when: nvim_missing_tools | length > 0 and nvim_notify_failures

    - name: Abort — tools are missing after a full install
      ansible.builtin.fail:
        msg: "missing after install: {{ nvim_missing_tools | join(', ') }}"
      when: nvim_missing_tools | length > 0
